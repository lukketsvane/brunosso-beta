<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Brunosso er BETA</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  background:#0a0806;
}

/* ══ APP ══ */
#app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden}

/* ══ STAGE ══ */
#stage{
  position:absolute;inset:0;
  transition:background 2s ease;
  background:linear-gradient(180deg,#FFF8E7,#F5E6C8);
}
#stage::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(20,14,8,0.1) 100%);
  pointer-events:none;z-index:2;
}

/* ══ SCENE CHARACTERS ══ */
#scene{position:absolute;inset:0;z-index:5}
.ch{
  position:absolute;transform-origin:center bottom;opacity:0;
  will-change:transform,opacity;
  transition:opacity 1s ease,transform 1s cubic-bezier(.22,1,.36,1);
  filter:drop-shadow(0 10px 30px rgba(20,14,8,.15));
}
.ch img{height:100%;width:auto;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.ch.v{opacity:1}

.e-fadeUp{transform:translateY(50px) scale(.88)}.e-fadeUp.v{transform:translateY(0) scale(1)}
.e-slideL{transform:translateX(-120px) scale(.88)}.e-slideL.v{transform:translateX(0) scale(1)}
.e-slideR{transform:translateX(120px) scale(.88)}.e-slideR.v{transform:translateX(0) scale(1)}
.e-shake{transform:scale(.75) rotate(-4deg)}.e-shake.v{transform:scale(1) rotate(0)}

@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sway{0%,100%{transform:rotate(0)}33%{transform:rotate(1.8deg)}66%{transform:rotate(-1.8deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-.8deg)}75%{transform:translateX(4px) rotate(.8deg)}}
.i-breathe{animation:breathe 4.5s ease-in-out infinite}
.i-bob{animation:bob 3.5s ease-in-out infinite}
.i-sway{animation:sway 6s ease-in-out infinite}
.i-shake{animation:shake .5s ease-in-out infinite}

/* ══ FADE OVERLAY ══ */
#fade{position:absolute;inset:0;background:#FFF8E7;opacity:0;pointer-events:none;z-index:8;transition:opacity .35s ease}
#fade.on{opacity:.55}

/* ══ SUBTITLES ══ */
#subs{
  position:absolute;
  bottom:max(env(safe-area-inset-bottom,20px),28px);
  left:50%;transform:translateX(-50%);
  z-index:40;width:min(92%,680px);
  text-align:center;
  pointer-events:none;
}
#sub-box{
  display:inline-block;
  background:rgba(12,8,4,.72);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:14px;
  padding:12px 22px;
  max-width:100%;
  opacity:0;
  transform:translateY(6px);
  transition:opacity .4s ease,transform .4s ease;
}
#sub-box.vis{opacity:1;transform:translateY(0)}
#sub-box.out{opacity:0;transform:translateY(-4px)}

.sub-line{
  font-family:'DM Sans',system-ui,-apple-system,sans-serif;
  font-size:clamp(14px,2.8vw,18px);
  line-height:1.55;
  color:rgba(255,252,245,.92);
  letter-spacing:.01em;
}
.sub-line.dlg{
  color:#FFD54F;
  font-weight:500;
}
.sub-line + .sub-line{margin-top:4px}

/* ══ CONTROLS — ultra minimal ══ */
#bar{
  position:absolute;
  bottom:0;left:0;right:0;
  height:3px;
  background:rgba(255,255,255,.08);
  z-index:50;
  cursor:pointer;
  transition:height .3s ease,background .3s ease;
}
#bar:hover,#bar.touch{height:6px;background:rgba(255,255,255,.12)}
#bar-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,rgba(212,160,23,.6),rgba(255,213,79,.7));
  border-radius:0 1px 1px 0;
  transition:width .2s linear;
}

/* Center play/pause ghost */
#ghost{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.8);
  z-index:45;
  width:80px;height:80px;
  border-radius:50%;
  background:rgba(255,252,245,.15);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease,transform .3s ease;
}
#ghost.vis{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#ghost svg{width:32px;height:32px;fill:rgba(255,252,245,.8)}

/* Chapter counter — whisper quiet */
#ch-num{
  position:absolute;
  top:max(env(safe-area-inset-top,12px),16px);
  right:16px;
  z-index:20;
  font-family:'Caveat',cursive;
  font-size:18px;
  color:rgba(62,39,35,.35);
  letter-spacing:.5px;
  opacity:0;
  transition:opacity .8s ease;
}
#ch-num.vis{opacity:1}

/* ══ TITLE ══ */
#title{
  position:fixed;inset:0;z-index:100;
  background:linear-gradient(180deg,#FFF8E7,#F5E6C8 40%,#E8DCC8);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;
  transition:opacity 1s ease;
}
#title.gone{opacity:0;pointer-events:none;visibility:hidden}
#title img{
  width:min(180px,32vw);margin-bottom:24px;
  filter:drop-shadow(0 8px 32px rgba(62,39,35,.18));
  animation:fl 4s ease-in-out infinite;
}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(1.2deg)}}
#title h1{font-family:'Caveat',cursive;font-size:min(68px,13vw);color:#3E2723;letter-spacing:1px;line-height:1;margin-bottom:6px}
#title p{font-family:'DM Sans',sans-serif;font-size:min(17px,3.8vw);color:#8D6E63;font-style:italic;margin-bottom:44px}
#title .tap{font-family:'Caveat',cursive;font-size:19px;color:#D4A017;animation:pu 2.5s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
</style>
</head>
<body>

</audio>

const SUB=[{"c":0,"t":0.0,"d":14.272,"l":["Det var stille i Ostedisken. Stille på den måten et kjøleskap er stille når det akkurat har sluttet å brumme og ikke har bestemt seg for om det gidder å begynne igjen."]},{"c":0,"t":14.472,"d":15.896,"l":["Brunosso sto med begge beina på hyllegulvet og stirret ut gjennom glasset. Armene hans hang ned langs sidene som to små karamelliserte pølser som ikke visste hvor de skulle gjøre av seg."]},{"c":0,"t":30.568,"d":3.077,"l":["-Hva er greia?","-Hmm?","-Hva er greia nå?"]},{"c":0,"t":33.844,"d":11.025,"l":["-Hvilken greie?","-GREIA, Raksu! Greia med at ingen har åpnet døra på tre timer!","-Har det gått tre timer? Jeg trodde det var tirsdag."]},{"c":0,"t":45.069,"d":4.529,"l":["-Det ER tirsdag!","-Åja, da stemmer det jo.","-Hva stemmer?"]},{"c":0,"t":49.798,"d":7.093,"l":["-At det er tirsdag.","-JA, MEN DET VAR IKKE DET JEG SNAKKET OM!","-Hva snakket du om, da?"]},{"c":0,"t":57.092,"d":3.504,"l":["-DØRA! Ingen har åpnet døra!","-Hvilken dør?"]},{"c":0,"t":60.796,"d":9.315,"l":["Brunosso satte noe i halsen. Glassdøra til Ostedisken ristet litt, som om den var flau over å være involvert."]},{"c":1,"t":70.611,"d":1.796,"l":["-Har du hørt om BETA?"]},{"c":1,"t":72.607,"d":10.662,"l":["Fløtemysost-Biped kom slentrende inn fra den andre enden av disken med et uttrykk som om noen nettopp hadde fortalt ham at ost ikke finnes."]},{"c":1,"t":83.469,"d":5.83,"l":["-BETA? Hva er det for noe?","-Alle har hørt om BETA.","-Jeg har ikke hørt om BETA."]},{"c":1,"t":89.498,"d":7.057,"l":["-Jo, det har du.","-Nei, det har jeg faktisk ikke.","-Du har hørt om BETA, Brunosso. Alle har det."]},{"c":1,"t":96.755,"d":8.668,"l":["-Okei, men hva ER det, da?","-Det trenger jeg vel ikke forklare hvis alle allerede vet det?","-MEN JEG VET DET JO IKKE!"]},{"c":1,"t":105.623,"d":2.148,"l":["-Da er du kanskje ikke alle."]},{"c":1,"t":107.971,"d":9.972,"l":["Fløtemysost-Biped løftet den ene foten sin og klødde seg bak det som muligens var et øre. Eller et hjørne. Det var vanskelig å si."]},{"c":1,"t":118.142,"d":2.531,"l":["-Hvem er det som ikke er alle nå?"]},{"c":1,"t":120.874,"d":5.523,"l":["Raksu hadde snudd seg rundt og sto og glodd med det ene store øyet sitt."]},{"c":1,"t":126.596,"d":9.205,"l":["-Brunosso er ikke alle, tydeligvis.","-Er ikke Brunosso alle? Jeg trodde Brunosso var alle.","-Nei, Brunosso er bare Brunosso."]},{"c":1,"t":136.001,"d":6.903,"l":["-Men hvem er alle, da?","-Alle er de som har hørt om BETA.","-Og Brunosso har ikke hørt om BETA?"]},{"c":1,"t":143.105,"d":3.912,"l":["-Nei.","-Da er Brunosso ingen.","-HEI! Jeg står rett her!"]},{"c":1,"t":147.217,"d":4.065,"l":["-Seff! Men du er jo ingen, så det gjør vel ingenting?"]},{"c":2,"t":151.782,"d":16.53,"l":["NBIM-Oljefondet satt i den mørke enden av disken med en avis som ikke fantes og en kaffekopp som aldri ble tom. Drakten hans var strøken. Den var alltid strøken. Selv drakten visste det var forventet."]},{"c":2,"t":168.512,"d":10.166,"l":["-Galanis-Fondet, vi trenger å snakke om BETA.","-Det heter ikke Galanis. Det heter NBIM.","-Ja, men du sitter der som en Galanis."]},{"c":2,"t":178.878,"d":10.579,"l":["-Hva er en Galanis for noe?","-Nei, glem det. Poenget er at BETA har begynt å sirkulere.","-Sirkulere? På hvilken måte sirkulerer den?"]},{"c":2,"t":189.658,"d":12.067,"l":["-På en smørbrødmåte. Den er overalt. På flatbrødene, i kantinene, bak kjøleskapet, under sengene.","-Under sengene? Har noen sett BETA under en seng?"]},{"c":2,"t":201.925,"d":17.605,"l":["-Jamfør rapport 14B om matsorter og deres tilhørende hvilesteder, så er det ikke unåturlig at en sammensetning av nytrekt torsk, flatbrød, smør, majones og brunost inntar en horisontal posisjon under et sovemøbel."]},{"c":2,"t":219.73,"d":4.463,"l":["-Hva faen sa du nå?","-Det er serious business, Brunosso."]},{"c":2,"t":224.393,"d":9.34,"l":["Kaffekoppen til NBIM-Oljefondet dirret litt. Den likte ikke å bli oversett når det ble snakk om serious business."]},{"c":3,"t":234.233,"d":2.218,"l":["-Smøragi!","-Hva?","-SmøRAGI!"]},{"c":3,"t":236.651,"d":4.725,"l":["-Ja, hva er det?","-Slå av den greia!","-Hvilken greie?"]},{"c":3,"t":241.576,"d":9.739,"l":["-Den greia du holder på med!","-Jeg holder ikke på med noen greie!","-Jo, du gjør det greia der med smøret!"]},{"c":3,"t":251.515,"d":13.886,"l":["-Jeg ER smør, Brunosso! Hva er det du forventer?","-At du SLUTTER Å SMØRE DEG UTOVER ALT!","-Det er min natur! Du ber meg om å slutte å være meg selv!"]},{"c":3,"t":265.601,"d":8.872,"l":["-Ja! Bare en liten stund! Er det så jævlig mye å be om?","-Vet du hva? Du høres ut som BETA nå."]},{"c":3,"t":274.673,"d":14.465,"l":["Det ble helt stille. Selv lufta i Ostedisken holdt pusten, og en liten dråpe kondens løsnet fra taket og falt i gulvet med en plask som sa altfor mye."]},{"c":3,"t":289.338,"d":6.557,"l":["-Si ikke det der.","-Hva, at du høres ut som BETA?","-JA! SI IKKE DET DER!"]},{"c":3,"t":296.095,"d":16.49,"l":["-Okei, okei! Bare sitt rolig i båten. Jeg trakk det tilbake.","-Du kan ikke trekke tilbake noe du allerede har sagt, Smøragi. Det er som å prøve å skrape smør av et flatbrød."]},{"c":3,"t":312.784,"d":1.832,"l":["-...","-Hva?","-Ikke noe."]},{"c":3,"t":314.817,"d":5.207,"l":["-Du tenkte på noe! Hva tenkte du på?","-BETA.","-HOLD KJEFT!"]},{"c":4,"t":320.524,"d":16.142,"l":["Nigiru var den typen karakter som aldri forklarte hva den var, og som ble fornærmet hvis noen spurte. Den hadde en gul farge som fløt over i oransje når den ble sint, noe som var det meste av tida."]},{"c":4,"t":336.866,"d":5.9,"l":["-Nigiru, vet du hva BETA er?","-Hva er du for en som spør?","-Jeg er Brunosso."]},{"c":4,"t":342.966,"d":4.916,"l":["-Ja, og hva så?","-Jeg spør om BETA.","-Og jeg spør hvem som spør."]},{"c":4,"t":348.082,"d":8.194,"l":["-Det har jeg jo sagt! Det er meg! Brunosso!","-Men hvorfor er det deg som spør?","-Fordi jeg lurer på det!"]},{"c":4,"t":356.476,"d":2.868,"l":["-På BETA?","-Ja!","-Alle vet hva BETA er."]},{"c":4,"t":359.544,"d":3.278,"l":["-ALLE SIER DET! Men INGEN forklarer det!"]},{"c":4,"t":363.022,"d":9.341,"l":["Nigiru snudde seg bort og så ut gjennom glassveggen med et blikk som kunne smeltet en ispinne på tjue meters hold."]},{"c":4,"t":372.563,"d":15.323,"l":["-Du vet hva BETA er, Brunosso. Du nekter bare å innrømme det.","-Nå kjenner jeg at jeg får vann i munnen av å tenke på det. Og det plager meg. For jeg vet ikke HVORFOR jeg får vann i munnen."]},{"c":4,"t":388.085,"d":6.309,"l":["-Åja, da er det allerede for sent.","-For sent for hva?","-For sent. Bare for sent."]},{"c":5,"t":394.895,"d":22.203,"l":["Huvuru hadde en spade i den ene hånda og et lurt smil som aldri forsvant. Den var oransje og firkantet og hadde noe som lignet ører, men som egentlig var håndtak. Eller omvendt. Ingen hadde noensinne spurt, og Huvuru hadde aldri tilbudt informasjonen frivillig."]},{"c":5,"t":417.298,"d":2.212,"l":["-Noen som vil ha flatbrød?"]},{"c":5,"t":419.71,"d":1.791,"l":["Alle snudde seg."]},{"c":5,"t":421.701,"d":10.719,"l":["-Hvor fikk du flatbrød fra, Huvuru?","-Det lå bak Triceratopsen.","-Bak Triceratopsen? Hva leter du etter bak Triceratopsen for noe?"]},{"c":5,"t":432.619,"d":18.205,"l":["-Jeg lette ikke. Flatbrødet fant meg.","-Flatbrød finner ikke folk, Huvuru. Det er ikke sånn matvarekjeden fungerer!","-Matvarekjeden fungerer akkurat sånn for flatbrød. Det er derfor det er flatt. Det legger seg på lur."]},{"c":5,"t":451.024,"d":2.042,"l":["Smøragi begynte å dirre."]},{"c":5,"t":453.266,"d":9.528,"l":["-Hvem sa flatbrød? Har noen flatbrød? Jeg kan smøre!","-NEI, Smøragi! Du smører INGENTING!","-Men det er det jeg GJØR!"]},{"c":5,"t":462.994,"d":12.59,"l":["-App app app! Ikke ett ord til! Vi vet alle hva som skjer når du begynner å smøre deg utover flatbrød.","-Hva skjer da?","-Da er vi ett steg nærmere BETA."]},{"c":5,"t":475.784,"d":8.422,"l":["Stillheten som fulgte var så tykk at man kunne smurt den på et flatbrød. Smøragi lot som ingenting."]},{"c":6,"t":484.706,"d":4.102,"l":["-Brunosso-Triceratops, har du sovet her hele natta?"]},{"c":6,"t":489.008,"d":10.697,"l":["Det enorme, brune dyret lå halvveis over tre hyller med det ene hornet plantet i en pakke Røros-smør som hadde gitt opp å protestere."]},{"c":6,"t":499.905,"d":4.021,"l":["-Mrrff.","-Er det et ja eller et nei?","-Mrrff er mrrff."]},{"c":6,"t":504.126,"d":11.984,"l":["-Men du kan ikke bare ligge her! Du blokkerer hele passasjen til de andre ostene!","-De andre ostene kan gå rundt.","-De kan ikke gå rundt, du er for BRED!"]},{"c":6,"t":516.31,"d":9.732,"l":["-Bred er et stygt ord.","-Det er ikke et stygt ord! Det er en fysisk beskrivelse!","-Alle fysiske beskrivelser av meg er stygt."]},{"c":6,"t":526.242,"d":2.574,"l":["-Det… gir jo ikke mening.","-Mrrff."]},{"c":6,"t":529.016,"d":11.501,"l":["Brunosso sparket en smørpakke ut av frustrasjon. Smørpakken bestemte seg for å ta det personlig og rullet av sted med en passiv-aggressiv fart."]},{"c":6,"t":540.718,"d":11.984,"l":["-Du vet hva, Triceratops? Noen dager føler jeg at hele denne disken er en labyrint av pølsevev.","-Mmm. Pølser. Jeg får vann i munnen av å tenke på det."]},{"c":6,"t":552.902,"d":4.665,"l":["-Det er ikke det det handler om!","-Hva handler det om?","-BETA!"]},{"c":6,"t":557.766,"d":1.77,"l":["-Mrrff."]},{"c":7,"t":560.037,"d":10.455,"l":["Brunefine var den eneste av dem som noen gang sa noe som lignet på noe vettugt. Det var derfor ingen hørte på henne."]},{"c":7,"t":570.691,"d":3.335,"l":["-Har noen av dere egentlig SETT BETA?"]},{"c":7,"t":574.226,"d":6.759,"l":["Tausheten som fulgte var av den typen som får møbler til å se ned i gulvet."]},{"c":7,"t":581.185,"d":15.051,"l":["-Sett BETA? Hva mener du med sett?","-Med øynene, Fløtemysost-Biped. Har du sett BETA. Med øynene dine. I virkeligheten.","-Man trenger ikke se noe for å vite at det finnes!"]},{"c":7,"t":596.436,"d":14.06,"l":["-Jo, egentlig gjør man det.","-Nei! Har du sett tyngdekraften?","-Tyngdekraften er ikke nytrekt torsk på flatbrød med smør, majones og brunost, Fløtemysost-Biped."]},{"c":7,"t":610.696,"d":14.06,"l":["-Hvordan VET du det? Har du sett tyngdekraften?","-Nå føler jeg at vi driver bort fra poenget.","-Poenget er at BETA er overalt! Alle vet det! Det er bare VANLIG!"]},{"c":7,"t":624.955,"d":15.772,"l":["Brunefine knep øynene igjen. Eller lukket dem. Det var vanskelig å se forskjell, men det lille sukket hun slapp ut fikk en liten dampsky til å stige opp fra overflaten hennes."]},{"c":7,"t":640.927,"d":10.815,"l":["-Og det er nettopp dét som er det merkelige, folkens.","-Hva da?","-At alle sier det er vanlig. For hva betyr egentlig vanlig?"]},{"c":7,"t":651.942,"d":9.283,"l":["-Vanlig betyr at alle har hørt om det.","-Og alle har hørt om det fordi det er vanlig?","-Ja! Nå skjønner du!"]},{"c":7,"t":661.425,"d":5.948,"l":["-Herregud. Det er en sirkel.","-En veldig fin sirkel!","-Det er en KULT."]},{"c":7,"t":667.574,"d":2.974,"l":["-EN KULT?? HOLD KJEFT, BRUNEFINE!"]},{"c":8,"t":671.048,"d":15.134,"l":["Bby-Brunosso hadde akkurat våknet fra en lur bak ei pakke Norvegia som hadde fungert som barnevakt i fire timer uten å klage en eneste gang. Norvegia-pakken så sliten ut. Veldig sliten."]},{"c":8,"t":686.382,"d":3.436,"l":["-Bababu!","-Ja, god morgen, Bby.","-Bababu beta!"]},{"c":8,"t":690.018,"d":1.772,"l":["Alle frøs."]},{"c":8,"t":691.99,"d":5.563,"l":["-Hva sa den?","-Den sa beta.","-Babyer sier mye rart. Det betyr ingenting!"]},{"c":8,"t":697.753,"d":11.944,"l":["-Den sa BETA, Fløtemysost-Biped! B-E-T-A!","-Det er ikke sånn babyer staver.","-BABYER STAVER IKKE I DET HELE TATT! DET ER NETTOPP DET SOM ER PROBLEMET!"]},{"c":8,"t":709.897,"d":10.308,"l":["-Hva er problemet med at babyer ikke staver?","-Problemet er at NÅR en baby sier BETA, så er det fordi den har HØRT noen si BETA!"]},{"c":8,"t":720.405,"d":1.772,"l":["-Seff! Men hvem?"]},{"c":8,"t":722.377,"d":12.926,"l":["De så på hverandre. Bby-Brunosso så på alle sammen med store, runde øyne og et uttrykk som var helt umulig å tolke som noe annet enn ren, uforfalsket brunost."]},{"c":8,"t":735.502,"d":7.117,"l":["-Bababu beta smør flatbrød!","-HVEM HAR SNAKKET OM FLATBRØD TIL BABYEN??","-Det var ikke meg!"]},{"c":8,"t":742.819,"d":8.753,"l":["-Ikke meg heller!","-Jeg snakket bare om smør! Smør er IKKE flatbrød!","-Åja? Og hva legger man smør PÅ, Smøragi?"]},{"c":8,"t":751.773,"d":12.026,"l":["-...mange ting?","-MANGE TING?? Du er en BETA-agent, Smøragi!","-Jeg er SMØR! Jeg er smør på ALLE ting! Det gjør meg ikke til en agent for noe som helst!"]},{"c":9,"t":764.299,"d":15.959,"l":["Fløtemysost satt for seg selv i et hjørne og sa ingenting. Det var det Fløtemysost alltid gjorde. Satt i et hjørne og sa ingenting. De andre hadde bein og armer og meninger. Fløtemysost var bare en ost."]},{"c":9,"t":780.457,"d":4.819,"l":["-Fløtemysost?","-...","-Fløtemysost, vi trenger din mening om BETA."]},{"c":9,"t":785.476,"d":5.846,"l":["-...","-Okei, hør her. Du trenger ikke snakke. Bare… nikk? Eller… vugge litt?"]},{"c":9,"t":791.523,"d":12.325,"l":["Fløtemysost gjorde ingenting. Den var en ost. Osten selv hadde aldri hatt noen illusjoner om dette. Det var de andre som stadig prøvde å dra den med i ting."]},{"c":9,"t":804.047,"d":9.796,"l":["-Brunosso, du kan ikke spørre en ost om politisk analyse.","-Politisk? Hvem sa politisk? BETA er ikke politisk!","-Hva er det, da?"]},{"c":9,"t":814.044,"d":7.031,"l":["-Det er… det er…","-Det er nytrekt torsk på flatbrød med smør, majones og brunost, Brunosso."]},{"c":9,"t":821.275,"d":2.133,"l":["Alle snudde seg mot Nigiru."]},{"c":9,"t":823.608,"d":9.322,"l":["-Hva sa du nå?","-BETA. Det er nytrekt torsk på flatbrød med smør, majones og brunost. Alle vet det.","-JEG VISSTE DET IKKE!"]},{"c":9,"t":833.13,"d":9.638,"l":["-Jo. Det er nettopp det vi har prøvd å si deg hele tiden.","-DERE HAR IKKE SAGT EN DRITT! DERE HAR BARE SAGT AT ALLE VET DET!"]},{"c":9,"t":842.969,"d":7.584,"l":["-Ja? Fordi alle vet det.","-MEN DERE FORKLARTE ALDRI HVA DET VAR!","-Trenger vi det? Det er jo vanlig."]},{"c":9,"t":850.753,"d":11.376,"l":["Fløtemysost sa fortsatt ingenting. Men om man så nøye etter, kunne man skimte en liten sprekk i overflaten som kanskje, kanskje, lignet et smil."]},{"c":10,"t":862.63,"d":15.37,"l":["NBIM-Oljefondet brettet avisen som ikke fantes og la den pent ved siden av kaffekoppen som ikke ville bli tom. Det var noe ved måten han brettet på som fikk hele rommet til å rette seg opp."]},{"c":10,"t":878.199,"d":9.352,"l":["-Jeg har lest noen rapporter.","-Rapporter? Fra hvem?","-Fra Smørfondets Internasjonale Avdeling for Brødbaserte Trusler."]},{"c":10,"t":887.751,"d":8.051,"l":["-Det finnes ikke.","-Jo, det gjør det. Vi opprettet det i går.","-I går? Du opprettet et helt fond i går?"]},{"c":10,"t":896.002,"d":20.33,"l":["-Det er det fond gjør, Brunosso. De opprettes. Jamfør vedtekter for statens direkte eierskap i melkebasert infrastruktur, paragraf 7, ledd 3: «Ethvert fond kan opprettes av et annet fond dersom det foreligger begrunnet mistanke om brødbasert risiko.»"]},{"c":10,"t":916.533,"d":4.879,"l":["-Er du gal?","-Nei, jeg er et fond.","-Du er en brunost med dress!"]},{"c":10,"t":921.612,"d":12.768,"l":["-Og du er en brunost uten dress. Hva er poenget ditt?","-Mitt poeng er at ingen har bedt deg om å opprette noe som helst! Vi prøver bare å finne ut hva BETA er!"]},{"c":10,"t":934.579,"d":16.59,"l":["-Det har vi allerede dokumentert. Se vedlegg 4, side 37: BETA er en kulinarisk konstruksjon bestående av nytrekt torsk på flatbrød med smør, majones og brunost. Risikovurdering: Høy. Anbefaling: Invester."]},{"c":10,"t":951.369,"d":9.189,"l":["-INVESTER?","-I ethvert fond finnes det kun én respons på risiko, Brunosso. Og det er investering.","-Da er saken biff!"]},{"c":10,"t":960.758,"d":3.822,"l":["-Biff er ikke på agendaen. Vi snakker om torsk."]},{"c":11,"t":965.081,"d":2.973,"l":["-Brunosso?","-Ja?","-Jeg må fortælle deg noe."]},{"c":11,"t":968.254,"d":4.955,"l":["-Hva da, Brunefine?","-Jeg tror… jeg tror vi alle er en del av BETA."]},{"c":11,"t":973.409,"d":10.368,"l":["Brunosso mistet nesten et hjørne. Det var nær, men han tok seg inn igjen. Et brunosthjørne er ikke noe man bare mister sånn uten videre."]},{"c":11,"t":983.977,"d":8.233,"l":["-Hva mener du med det?","-Tenk på det. Hva er BETA? Nytrekt torsk på flatbrød med smør, majones og brunost.","-Ja?"]},{"c":11,"t":992.41,"d":4.574,"l":["-Og hva er du?","-Jeg er Brunosso.","-Og hva er Brunosso laget av?"]},{"c":11,"t":997.184,"d":3.354,"l":["-…brunost?","-Og hva er Smøragi laget av?","-Smør…"]},{"c":11,"t":1000.738,"d":7.09,"l":["-Og hvem har vi som ligger på flatbrød bak Triceratopsen?","-Herregud.","-Hva mangler vi, Brunosso?"]},{"c":11,"t":1008.028,"d":7.623,"l":["-Torsk. Torsk og majones.","-Så spørsmålet er ikke hva BETA er. Spørsmålet er hvem som leverer torsken."]},{"c":11,"t":1015.851,"d":15.78,"l":["Et sted langt borte i butikken hørtes en dør som gikk opp. Kulda som strømmet inn lukte salt og hav og noe annet som ingen av dem greide å sette ord på, men som fikk Smøragi til å smeltes litt på overflaten."]},{"c":12,"t":1032.131,"d":11.784,"l":["Her følger en kort redegjørelse for BETA-konseptet, slik det er forstått av Smørfondets Internasjonale Avdeling for Brødbaserte Trusler, avdeling Nord-Vest:"]},{"c":12,"t":1044.115,"d":25.607,"l":["BETA er et sammensatt måltid bestående av nytrekt torsk på flatbrød med smør, majones og brunost. BETA har ingen leder, ingen logo, og intet hovedkvarter. BETA eksisterer når komponentene er samlet. Når komponentene er adskilt, er BETA kun en mulighet. Det er denne muligheten som gjør BETA farlig, eller ufarlig, avhengig av hvem du spør."]},{"c":12,"t":1069.923,"d":29.762,"l":["«Alle har hørt om BETA» er den mest gjentatte frasen i forbindelse med fenomenet. Det er også den minst verifiserbare. Ingen har lyktes i å påvise en eneste person som uavhengig av andre har «hørt om» BETA. Alle som sier de har hørt om BETA, har hørt om BETA fra noen som også har hørt om BETA fra noen som har hørt om BETA. Det er, som Brunefine påpekte i kapittel 8, en sirkel. Eller en kult."]},{"c":12,"t":1099.884,"d":8.158,"l":["Det som gjør BETA spesielt problematisk for beboerne i Ostedisken, er at de selv utgjør to av ingrediensene."]},{"c":13,"t":1108.542,"d":1.796,"l":["-Nå skal dere høre!"]},{"c":13,"t":1110.539,"d":10.38,"l":["Raksu hadde klart å klatre opp på den øverste hylla og sto der og veivet med armene som en gal vindmølle med selvtillit."]},{"c":13,"t":1121.119,"d":4.931,"l":["-Hva er det nå, Raksu?","-Jeg har tenkt på noe!","-Det er nytt."]},{"c":13,"t":1126.25,"d":11.937,"l":["-Hold kjeft, Nigiru! Jeg har tenkt, og det jeg har tenkt er følgende: Hva om BETA ikke er en ting?","-Hva mener du?","-Hva om BETA er en person?"]},{"c":13,"t":1138.387,"d":9.256,"l":["Smøragi sluttet å smøre. Brunosso-Triceratops åpnet det ene øyet. Selv Fløtemysost virket litt… oppmerksom."]},{"c":13,"t":1147.843,"d":14.619,"l":["-En person? Hva slags person?","-En person som ER nytrekt torsk på flatbrød med smør, majones og brunost.","-Raksu, det gir jo ingen mening. En person kan ikke være et måltid."]},{"c":13,"t":1162.662,"d":14.879,"l":["-DU er en ost med bein, Brunosso! Jeg er… hva enn jeg er… med bein! Triceratopsen er en dinosaur laget av brunost! Hvem er DU til å si at en person ikke kan være et måltid?"]},{"c":13,"t":1177.741,"d":2.768,"l":["-…","-Ja, tenk på det.","-Faen, Raksu."]},{"c":13,"t":1180.709,"d":4.585,"l":["-Da er saken biff.","-Biff er fortsatt ikke på agendaen!"]},{"c":14,"t":1185.793,"d":13.177,"l":["Klokka var noe som ingen visste, for det var ingen klokke i Ostedisken. Tid ble målt i hvor lenge et smør holdt seg fast, noe som varierte sterkt avhengig av Smøragis humør."]},{"c":14,"t":1199.17,"d":3.047,"l":["-Huvuru?","-Ja?","-Hva gjør du med den spaden?"]},{"c":14,"t":1202.417,"d":2.437,"l":["-Graver.","-Graver etter hva?","-BETA."]},{"c":14,"t":1205.055,"d":8.759,"l":["-Du kan ikke grave etter BETA inne i en kjøledisk, Huvuru!","-Hvorfor ikke?","-Fordi det ikke er jord her! Det er hyller!"]},{"c":14,"t":1214.014,"d":7.388,"l":["-Hyller kan inneholde hemmeligheter.","-De inneholder OST, Huvuru! OST og SMØR og MELK!","-Og flatbrød."]},{"c":14,"t":1221.602,"d":5.713,"l":["-FLATBRØDET HØRER IKKE HJEMME HER!","-Men det er her.","-JA, OG DET ER PROBLEMET!"]},{"c":14,"t":1227.515,"d":4.875,"l":["-Er det?","-Er det ikke?","-Hmm. Kanskje problemet ikke er flatbrødet."]},{"c":14,"t":1232.59,"d":6.398,"l":["-Hva er problemet, da?","-Kanskje problemet er at vi er redde for noe som bare er… mat."]},{"c":14,"t":1239.188,"d":11.197,"l":["Brunosso åpnet munnen for å svare, men Bby-Brunosso valgte akkurat det øyeblikket til å kaste opp litt på Norvegia-pakken, og øyeblikket var borte."]},{"c":15,"t":1250.884,"d":6.752,"l":["-Hva er den største trusselen mot Ostedisken i dag?","-BETA!","-Te!"]},{"c":15,"t":1257.836,"d":11.179,"l":["-Strømmstansen forrige onsdag!","-Brunosso-Triceratops sin vane med å sove tvers over tre hyller!","-Mrrff."]},{"c":15,"t":1269.216,"d":13.172,"l":["-NBIM-Oljefondet sin tendens til å opprette fond for enhver anledning!","-Det er risikohåndtering, ikke en trussel.","-BANAN!"]},{"c":15,"t":1282.588,"d":2.103,"l":["Alle så på Smøragi."]},{"c":15,"t":1284.891,"d":16.05,"l":["-Hva faen har banan med dette å gjøre?","-Banan på brunost! Har dere aldri prøvd? Det er NYDELIG.","-Vi snakker om TRUSLER, Smøragi, ikke MELLOMMÅLTID!"]},{"c":15,"t":1301.14,"d":12.508,"l":["-En trussel kan også være nydelig! BETA er jo visst nydelig, og den er en trussel!","-Hvem sa BETA er nydelig?","-Alle?"]},{"c":15,"t":1313.848,"d":15.164,"l":["-DER IGJEN! ALLE! ALLE, ALLE, ALLE! HVEM ER ALLE?!","-Alle er de som har…","-HVIS DU SIER «HØRT OM BETA» EN GANG TIL, SÅ GJØR JEG NOE DRASTISK!"]},{"c":15,"t":1329.212,"d":10.183,"l":["-Hva da?","-Jeg vet ikke! Noe!","-Når du vet hva det er, kan du gi beskjed. Vi sitter her uansett."]},{"c":16,"t":1339.895,"d":22.898,"l":["Noe skjedde med lyset i Ostedisken. Det blinket to ganger, holdt pusten, og blinket en gang til. Lampa over midthylla hadde utviklet en nervøs tic de siste dagene, og ingen visste hvorfor, men alle mistenkte at det hadde noe med BETA å gjøre. Alt hadde noe med BETA å gjøre for tida."]},{"c":16,"t":1362.993,"d":1.798,"l":["-Jeg må innrømme noe."]},{"c":16,"t":1364.991,"d":7.525,"l":["Det var Smøragi. Han sto midt på gulvet med et uttrykk som var halvveis anger, halvveis smør."]},{"c":16,"t":1372.716,"d":4.612,"l":["-Innrømme hva, Smøragi?","-Jeg har… vært på et flatbrød.","-NÅ?"]},{"c":16,"t":1377.527,"d":9.305,"l":["-Nei, ikke nå! Forrige uke. Det var… det var bare en gang.","-En gang på et flatbrød. Var det noen andre der?","-Majones."]},{"c":16,"t":1387.032,"d":12.865,"l":["-MAJONES?! Smøragi, sa du MAJONES?","-Det bare skjedde! Vi lå ved siden av hverandre på flatbrødet, og… det ene førte til det andre, og plutselig var vi… blandet."]},{"c":16,"t":1400.097,"d":6.23,"l":["-Du var blandet med majones på et flatbrød.","-Ja.","-Og… var det noen brunost der?"]},{"c":16,"t":1406.527,"d":3.884,"l":["-Nei! Det var ingen brunost!","-Torsk?","-INGEN TORSK!"]},{"c":16,"t":1410.611,"d":11.651,"l":["-Så du var altså bare smør og majones på flatbrød?","-Ja! Det er alt! Det var ikke BETA!","-Men du var to ingredienser unna, Smøragi. To ingredienser."]},{"c":16,"t":1422.462,"d":9.305,"l":["Smøragi begynte å gråte. Det var en stille gråt, den typen som får smør til å bli litt mjukere enn det allerede er."]},{"c":17,"t":1432.266,"d":1.776,"l":["-Hvem er det?"]},{"c":17,"t":1434.242,"d":16.438,"l":["Det kom en lyd fra baksiden av disken. En slags slurping. Eller dragging. Noe ble dratt over gulvet på en måte som verken var høflig eller diskret."]},{"c":17,"t":1450.881,"d":5.032,"l":["-Hallo?","-Hvem spør?","-Brunosso spør! Hvem er du?"]},{"c":17,"t":1456.113,"d":2.46,"l":["-Alle vet hvem jeg er."]},{"c":17,"t":1458.773,"d":11.518,"l":["Brunosso kjønte det i magen. Eller i det som tilsvarer en mage når man er en firkanta brunost med bein."]},{"c":17,"t":1470.491,"d":1.776,"l":["-BETA?"]},{"c":17,"t":1472.467,"d":30.64,"l":["Ut fra skyggen bak den nederste hylla kom det en skikkelse. Den var flat. Bred. Den luktet salt, og hav, og noe søtlig som ikke burde være der. På toppen lå det noe hvitt og mykt, og under det noe brunt og gyllent, og under dét igjen var det flatbrød så langt øyet kunne se."]},{"c":17,"t":1503.307,"d":11.742,"l":["-Du må være Brunosso.","-Og du må være BETA.","-BETA? Nei, nei. BETA er ikke noe jeg ER. BETA er noe som SKJER."]},{"c":17,"t":1515.249,"d":20.576,"l":["-Hva mener du?","-Jeg mener at BETA ikke er en person, Brunosso. BETA er et øyeblikk. Det øyeblikket når torsk møter flatbrød møter smør møter majones møter brunost. Det er et STEVNEMØTE."]},{"c":17,"t":1536.025,"d":5.032,"l":["-Et stevnemøte…","-Og dere er allerede invitert."]},{"c":18,"t":1541.557,"d":1.763,"l":["-INGEN GÅR NOE STED!"]},{"c":18,"t":1543.521,"d":7.128,"l":["Brunosso hadde stilt seg foran døra med armene ut til sidene, som om han var stor nok til å blokkere noe som helst. Han var ikke det."]},{"c":18,"t":1550.849,"d":3.484,"l":["-Brunosso, flytt deg.","-Nei!","-Du er en 200 grams brunost. Flytt deg."]},{"c":18,"t":1554.533,"d":7.45,"l":["-DERE SKJØNNER IKKE HVA DERE GJØR! Hvis dere går dit, blir dere en del av BETA!","-Og?","-OG?? OG?? Er du helt… har du fått sepsis i huet, Raksu?"]},{"c":18,"t":1562.182,"d":6.539,"l":["-Jeg skjønner bare ikke hva som er så farlig. Det er jo bare mat.","-Vi ER mat, Raksu! Vi er mat som prøver å ikke bli spist!"]},{"c":18,"t":1568.921,"d":6.914,"l":["-Er vi det? Jeg trodde vi bare var her.","-Akkurat! Vi bare ER her! Og hvis vi går dit, så bare ER vi DER, og DER er på et flatbrød!"]},{"c":18,"t":1576.035,"d":2.197,"l":["-Med torsk.","-Med torsk og majones og SMØR!"]},{"c":18,"t":1578.432,"d":1.763,"l":["Smøragi så ned i gulvet."]},{"c":18,"t":1580.396,"d":2.412,"l":["-Smøragi, se på meg.","-Nei.","-Se på meg, Smøragi!"]},{"c":18,"t":1583.007,"d":4.234,"l":["-Jeg har allerede vært der, Brunosso. Og vet du hva?","-Hva?","-Det var… ganske godt."]},{"c":18,"t":1587.441,"d":9.058,"l":["-NEI! NEI NEI NEI!","-Jo. Det var godt. Majones er hyggelig. Flatbrød er behagelig. Og torsk… torsk er varmt, Brunosso. Torsk er varmt og mykt og det føles som å bli holdt."]},{"c":18,"t":1596.699,"d":4.609,"l":["-Du beskriver en KULT, Smøragi!","-Kanskje. Men det var den beste tirsdagen jeg har hatt."]},{"c":19,"t":1601.808,"d":18.031,"l":["BETA-vesenet (eller hendelsen, eller hva det nå var) hadde satt seg til rette på nederste hylle. Torsken dampen litt i kuldegraden, og majonesen glødet svakt som en små lykter i tåka."]},{"c":19,"t":1620.039,"d":10.543,"l":["-Dere frykter meg. Det er forståelig.","-Vi frykter deg ikke! Vi bare… vi skjønner deg ikke.","-Det er det samme."]},{"c":19,"t":1630.782,"d":14.878,"l":["-Det er det IKKE!","-Hør her, Brunosso. Alt jeg er, er en kombinasjon. Torsk. Flatbrød. Smør. Majones. Brunost. Hver for seg er de bare… ting. Men sammen…"]},{"c":19,"t":1645.859,"d":14.09,"l":["-Sammen er det en KULT!","-Sammen er det noe alle kjenner. Noe alle husker. Noe bestemor lagde. Noe som lukter av kjøkken klokka fem på en fredag."]},{"c":19,"t":1660.149,"d":10.148,"l":["Det ble stille igjen. Brunosso-Triceratops hadde åpnet begge øynene nå, noe som aldri hadde skjedd før."]},{"c":19,"t":1670.497,"d":10.838,"l":["-Men… men du bruker OSS. Du bruker smør og brunost som INGREDIENSER.","-Og hva bruker du smør til, Brunosso?","-Hva?"]},{"c":19,"t":1681.536,"d":5.616,"l":["-Når du smører smør på brødet ditt. Spør du smøret først?"]},{"c":19,"t":1687.352,"d":5.616,"l":["Smøragi stirret på Brunosso. Brunosso stirret på Smøragi."]},{"c":19,"t":1693.168,"d":5.123,"l":["-…nei?","-Så hva er forskjellen?","-Forskjellen er at… at…"]},{"c":19,"t":1698.491,"d":14.09,"l":["-At du er redd for å være en del av noe større enn deg selv?","-Jeg er redd for å bli SPIST, din jævla torsk!","-Haha! Der kom det. Da er saken biff!"]},{"c":19,"t":1712.781,"d":4.138,"l":["-SLUTT Å SI BIFF! INGEN BIFF ER INVOLVERT!"]},{"c":20,"t":1717.419,"d":1.988,"l":["-Jeg har en annønsering."]},{"c":20,"t":1719.607,"d":6.46,"l":["NBIM-Oljefondet sto opp. Drakten hang perfekt. Kaffekoppen var fremdeles full."]},{"c":20,"t":1726.266,"d":11.843,"l":["-Etter grundig analyse har Smørfondets Internasjonale Avdeling for Brødbaserte Trusler kommet til følgende konklusjon: BETA er ikke en trussel."]},{"c":20,"t":1738.309,"d":4.224,"l":["-HVA?","-BETA er en INVESTERING.","-En investering i HVA?"]},{"c":20,"t":1742.732,"d":14.244,"l":["-I samarbeid. I synergi. I det vi i fondsmiljøet kaller «kryssfunksjonell ingrediensoptimalisering».","-Det der er bare fancy ord for å si at vi skal legge oss på et flatbrød!"]},{"c":20,"t":1757.176,"d":10.352,"l":["-Korrekt. Med en forventet avkastning på «alle har hørt om det», som er den største merkevareplattformen i norsk mathistorie."]},{"c":20,"t":1767.728,"d":16.894,"l":["-Han er gal. Han er helt gal.","-Gal? Jamfør kvartalsrapport 3: Vi er BRUNOST, Brunosso. Brunost på flatbrød med fisk er selve GRUNNMUREN i den norske matidentiteten. Og BETA er bare… den nyeste iterasjonen."]},{"c":20,"t":1784.823,"d":11.594,"l":["-Men folk… folk tror det er VANLIG. De er i en KULT!","-Åja? Og hva er vanligere enn brunost, Brunosso? Er ikke vi også noe «alle har hørt om»?"]},{"c":20,"t":1796.617,"d":12.753,"l":["Det traff ham som en kjølediskdør i fleisen. Brunosso satte seg ned. Han hadde ikke satt seg ned på veldig lenge, og gulvet var overrasket over kontakten."]},{"c":21,"t":1809.87,"d":1.958,"l":["-Brunosso?","-Hva?","-Er du sur?"]},{"c":21,"t":1812.028,"d":4.743,"l":["-Nei.","-Du ser sur ut.","-Jeg er en brunost. Jeg ser alltid sånn ut."]},{"c":21,"t":1816.971,"d":8.508,"l":["-Nei, du ser annerledes sur ut enn vanlig.","-Hvordan kan man se annerledes sur ut enn vanlig?","-Hjørnene dine henger."]},{"c":21,"t":1825.678,"d":4.818,"l":["Brunosso så ned på hjørnene sine. De hang. Brunefine hadde rett."]},{"c":21,"t":1830.697,"d":18.069,"l":["-Okei, kanskje jeg er litt sur.","-Er det på grunn av BETA?","-Det er på grunn av ALT. Det er på grunn av at alle vet noe jeg ikke vet, og når jeg endelig finner ut av det, så viser det seg at det jeg ikke visste var at JEG SELV er en del av det!"]},{"c":21,"t":1848.966,"d":10.992,"l":["-Ja, det er litt kjipt.","-LITT kjipt? Det er som å finne ut at posen du bor i er en ingrediensliste!","-Men er det så farlig, da? Å være en del av noe?"]},{"c":21,"t":1860.159,"d":10.089,"l":["-Ja, når det noe er nytrekt torsk på flatbrød med smør, majones og brunost!","-Men det høres jo godt ut.","-SLUTT Å SI AT DET HØRES GODT UT!"]},{"c":21,"t":1870.447,"d":7.002,"l":["-Unnskyld.","-Nei, du trenger ikke unnskylde. Jeg… jeg er bare lei meg.","-Vil du ha en klem, baby?"]},{"c":21,"t":1877.649,"d":5.044,"l":["-Nei. Jeg vil ha en pølse.","-Da henter jeg en pølse.","-Takk, Brunefine."]},{"c":21,"t":1882.894,"d":1.768,"l":["-Seff!"]},{"c":22,"t":1885.161,"d":9.695,"l":["Raksu hadde laget et oppslag på innsida av glassdøra. Det sto:","BETA-MØTE","Når: Når Smøragi sier det er greit"]},{"c":22,"t":1895.056,"d":12.095,"l":["Hvor: På flatbrødet bak Triceratopsen","Agenda: Er vi en kult? Er vi mat? Er vi begge deler?","Medbring: Deg selv (og eventuelt en pølse)"]},{"c":22,"t":1907.351,"d":9.418,"l":["-Raksu, du kan ikke innkalle til møte på et flatbrød!","-Hvorfor ikke?","-Fordi det er AKKURAT det BETA vil!"]},{"c":22,"t":1916.969,"d":15.788,"l":["-BETA vil at vi skal ha et møte?","-BETA vil at vi skal samles på et flatbrød! Det er hele poenget!","-Men vi samles jo på flatbrødet for å DISKUTERE BETA, ikke for å VÆRE BETA."]},{"c":22,"t":1932.957,"d":12.557,"l":["-Det er ingen forskjell!","-Seff er det forskjell! Hvis du sitter på en stol, er du ikke en stol!","-En stol er ikke en rett alle har hørt om!"]},{"c":22,"t":1945.714,"d":9.418,"l":["-Hmm. Kanskje det burde vært det.","-Hva mener du?","-Stol-BETA. Torsk på stol med smør, majones og brunost."]},{"c":22,"t":1955.332,"d":7.94,"l":["-Det er det dummeste jeg har hørt.","-Og likevel får jeg vann i munnen av å tenke på det."]},{"c":23,"t":1963.772,"d":15.117,"l":["BETA-vesenet (eller -hendelsen, eller -øyeblikket) hadde sittet stille i flere timer. Torsken var ikke like varm lenger, men den dampen fortsatt litt, som en gammel radiator som nekter å gi seg."]},{"c":23,"t":1979.089,"d":7.169,"l":["-Kan jeg stille deg et spørsmål?","-Du har stilt meg spørsmål hele dagen, Brunosso.","-Et til, da."]},{"c":23,"t":1986.457,"d":1.8,"l":["-Bare kjør.","-Er du… ond?"]},{"c":23,"t":1988.457,"d":10.987,"l":["BETA lo. Eller det var det det hørtes ut som. Det var vanskelig å si, for lyden ble absorbert av majonesen og gjengitt som en slags gurgling."]},{"c":23,"t":1999.644,"d":24.389,"l":["-Ond? Brunosso, jeg er MAT. Mat er ikke ond.","-Noen mat er jævlig ond. Har du noen gang smakt sur sild etter midnatt?","-Poenget er at jeg ikke velger noe. Jeg bare skjer. Når noen legger torsk på flatbrød med smør, majones og brunost, så er jeg der. Når de ikke gjør det, så er jeg ikke der. Jeg er et… valkvalifikat."]},{"c":23,"t":2024.233,"d":5.922,"l":["-Et hva?","-Et… alternativ. Et valg noen tar.","-Men alle sier de har hørt om deg!"]},{"c":23,"t":2030.355,"d":13.87,"l":["-Ja. For alle HAR hørt om meg. Bestemødre forteller om meg. Kantiner serverer meg. Jeg er på hver eneste hytte i dette landet. Er det en kult, Brunosso? Eller er det bare… Norge?"]},{"c":23,"t":2044.425,"d":11.298,"l":["Brunosso stirret på BETA. BETA stirret på Brunosso. Et sted imellom dem lå et flatbrød og en sannhet som ingen av dem helt greide å sette ord på."]},{"c":24,"t":2056.223,"d":6.301,"l":["-Okei.","-Okei?","-Okei, BETA. Greit. Du er ikke ond. Du er en… ting. En hendelse. Et måltid. Fine."]},{"c":24,"t":2062.724,"d":1.779,"l":["-Takk.","-MEN.","-Men?"]},{"c":24,"t":2064.703,"d":9.215,"l":["-Smøragi må få velge selv. Og brunosten—JEG må få velge selv. Vi er ikke bare ingredienser. Vi er… vi.","-Det har jeg aldri sagt noe annet."]},{"c":24,"t":2074.117,"d":8.808,"l":["-Åjo! Du sa «dere er allerede invitert»!","-Invitert, ja. Ikke innkalt. Det er forskjell på en invitasjon og en innkalling, Brunosso."]},{"c":24,"t":2083.126,"d":8.605,"l":["-Er det?","-Ja. En innkalling må du følge. En invitasjon kan du takke nei til. Jeg inviterer. Alltid. Jeg tvinger aldri.","-Men alle…"]},{"c":24,"t":2091.931,"d":4.404,"l":["-Ja. Alle takker ja. For det er godt, Brunosso. Det er bare godt."]},{"c":24,"t":2096.535,"d":8.469,"l":["Bby-Brunosso kom rullende bort til BETA-vesenet og la seg inntil torsken. Den var varm. Babyen sa ingenting. Den bare lå der."]},{"c":24,"t":2105.204,"d":6.708,"l":["-Bababu.","-Se der. Noen har allerede bestemt seg.","-Det er en BABY! Babyer bestemmer seg ikke for ting!"]},{"c":24,"t":2112.112,"d":3.862,"l":["-Babyer bestemmer seg for alt. Det er voksne som slutter."]},{"c":25,"t":2116.474,"d":28.609,"l":["Det ble en lang kveld i Ostedisken. Smøragi smørte seg utover flatbrødet — frivillig, denne gangen — og det så ut som om en byrde løftet seg fra de små smørskuldrene hans. Nigiru satt ved kanten og så på med et uttrykk som muligens var noe nær aksept, eller muligens bare måten Nigiru alltid så ut på."]},{"c":25,"t":2145.283,"d":5.988,"l":["-Så… vi bare sitter her nå?","-Vi bare sitter her.","-På et flatbrød."]},{"c":25,"t":2151.471,"d":3.992,"l":["-På et flatbrød, ja.","-Med torsk.","-Med torsk."]},{"c":25,"t":2155.663,"d":4.182,"l":["-Og majones.","-Og majones, mhm.","-Er dette BETA?"]},{"c":25,"t":2160.045,"d":5.703,"l":["-Vet du hva, Brunosso? Jeg tror kanskje det bare er tirsdag."]},{"c":25,"t":2165.947,"d":32.506,"l":["Brunosso-Triceratops snorket fra den andre enden av disken. Fløtemysost sa ingenting. NBIM-Oljefondet noterte noe om «kryssfunksjonell ingrediensoptimalisering, kvartalsresultat: positiv». Raksu hadde somnet på toppen av hylla med det ene øyet halvveis åpent, som en kjøleskapslampe som ikke helt hadde bestemt seg for om den var av eller på."]},{"c":25,"t":2198.653,"d":3.897,"l":["-Brunefine?","-Ja?","-Tror du dette er en kult?"]},{"c":25,"t":2202.75,"d":3.992,"l":["-Tror du det spiller noen rolle?","-Hmm.","-Hmm."]},{"c":25,"t":2206.942,"d":37.163,"l":["Bby-Brunosso sov med nesa i majonesen. Smøragi sov på flatbrødet. Huvuru hadde gravd seg ned med spaden sin og var ikke å se noe sted. Og et sted i alt dette, i varmen fra torsken og duften av smør og den søtlige, brune lukta av brunost, var BETA. Ikke som en trussel. Ikke som en kult. Bare som en tirsdag i en kjøledisk i Norge, der alle hadde hørt om det, og ingen kunne forklare hvorfor."]},{"c":26,"t":2244.605,"d":16.535,"l":["Neste morgen var BETA borte. Flatbrødet lå der fortsatt, men torsken hadde fordampet, majonesen hadde tørket inn til en liten hvit flekk, og det eneste som gjensto var et svakt avtrykk av noe som hadde vært der."]},{"c":26,"t":2261.34,"d":3.526,"l":["-Hvor ble det av BETA?","-Spist.","-SPIST? Av hvem?"]},{"c":26,"t":2265.066,"d":6.504,"l":["-Av alle.","-DER IGJEN!","-Alle, Brunosso. Alle spiste BETA. Det er det man gjør med mat."]},{"c":26,"t":2271.771,"d":4.232,"l":["Brunosso så på sine egne hjørner. De hang ikke lenger."]},{"c":26,"t":2276.202,"d":3.526,"l":["-Men… vi er også mat.","-Ja.","-Så hvem spiser oss?"]},{"c":26,"t":2279.929,"d":1.722,"l":["-Alle."]},{"c":26,"t":2281.851,"d":12.068,"l":["Det ble stille i Ostedisken. Stille på den måten et kjøleskap er stille når det akkurat har sluttet å brumme og har bestemt seg for å aldri begynne igjen."]},{"c":26,"t":2294.119,"d":2.821,"l":["-Hva er greia nå?","-Hmm?","-Hva er greia?"]},{"c":26,"t":2297.14,"d":3.37,"l":["-Hvilken greie?","-GREIA, Raksu!","-Har du pølse?"]},{"c":26,"t":2300.71,"d":1.724,"l":["-…ja. Vil du ha?","-Seff!"]},{"c":26,"t":2302.634,"d":1.722,"l":["Slutt."]}];
const T=2304.856;

const $=id=>document.getElementById(id);
const au=$('audio'),sc=$('scene'),fd=$('fade'),
      subBox=$('sub-box'),barF=$('bar-fill'),
      chNum=$('ch-num'),ghost=$('ghost'),
      gPlay=$('gPlay'),gPause=$('gPause'),
      titleEl=$('title');

let cur=-1,subIdx=-1,playing=false,ghostTimer=null;

// ── Preload ──
(function(){
  const s=new Set();
  CH.forEach(c=>c.scene.ch.forEach(x=>s.add(x.a)));
  s.forEach(a=>{const i=new Image();i.src='assets/'+a});
  setTimeout(()=>{setScene(0);cur=0},80);
})();

// ── Start ──
function start(){
  titleEl.classList.add('gone');
  au.play().then(()=>{playing=true;updGhost()}).catch(()=>{});
}

function toggle(){
  if(!titleEl.classList.contains('gone'))return start();
  playing?au.pause():au.play().catch(()=>{});
}

function tapStage(){
  // Show ghost briefly
  ghost.classList.add('vis');
  clearTimeout(ghostTimer);
  ghostTimer=setTimeout(()=>{if(playing)ghost.classList.remove('vis')},2500);
}

function seekBar(e){
  e.stopPropagation();
  const r=$('bar').getBoundingClientRect();
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const pct=Math.max(0,Math.min(1,(cx-r.left)/r.width));
  au.currentTime=pct*T;
  if(!playing)au.play().catch(()=>{});
}

au.addEventListener('play',()=>{playing=true;updGhost();hideGhostSoon()});
au.addEventListener('pause',()=>{playing=false;updGhost();ghost.classList.add('vis')});
au.addEventListener('ended',()=>{playing=false;updGhost()});
au.addEventListener('timeupdate',tick);

function updGhost(){
  gPlay.style.display=playing?'none':'';
  gPause.style.display=playing?'':'none';
}

function hideGhostSoon(){
  clearTimeout(ghostTimer);
  ghostTimer=setTimeout(()=>{if(playing)ghost.classList.remove('vis')},2000);
}

// ── Keyboard ──
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();toggle()}
  if(e.code==='ArrowRight')skip(1);
  if(e.code==='ArrowLeft')skip(-1);
});

function skip(dir){
  const idx=Math.max(0,Math.min(CH.length-1,cur+dir));
  au.currentTime=CH[idx].start+.05;
  if(!playing)au.play().catch(()=>{});
  cur=-1;tick();
}

// ── Tick ──
function tick(){
  const t=au.currentTime;
  barF.style.width=(t/T*100)+'%';

  // Chapter detection
  let ch=0;
  for(let i=CH.length-1;i>=0;i--){if(t>=CH[i].start){ch=i;break}}
  if(ch!==cur){cur=ch;setScene(ch)}

  // Subtitle detection — binary search
  let si=-1;
  for(let i=SUB.length-1;i>=0;i--){
    if(t>=SUB[i].t && t<SUB[i].t+SUB[i].d){si=i;break}
  }
  if(si!==subIdx){
    subIdx=si;
    showSub(si);
  }
}

// ── Subtitles ──
function showSub(idx){
  if(idx<0){
    subBox.classList.remove('vis');
    subBox.classList.add('out');
    return;
  }
  const cue=SUB[idx];
  // Build HTML
  let h='';
  for(const l of cue.l){
    const isDlg=l.startsWith('-');
    const cls=isDlg?'sub-line dlg':'sub-line';
    const txt=l.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h+='<div class="'+cls+'">'+txt+'</div>';
  }

  // Crossfade
  subBox.classList.remove('vis');
  subBox.classList.add('out');
  setTimeout(()=>{
    subBox.innerHTML=h;
    subBox.classList.remove('out');
    subBox.classList.add('vis');
  },150);
}

// ── Scene ──
function setScene(idx){
  const s=CH[idx].scene;
  $('stage').style.background='linear-gradient(180deg,'+s.bg[0]+','+s.bg[1]+')';

  chNum.textContent=(idx+1)+' / '+CH.length;
  chNum.classList.remove('vis');
  setTimeout(()=>chNum.classList.add('vis'),200);

  fd.classList.add('on');
  setTimeout(()=>{
    sc.innerHTML='';
    const H=$('stage').offsetHeight;
    s.ch.forEach((c,i)=>{
      const el=document.createElement('div');
      el.className='ch e-'+c.e;
      const h=H*c.s;
      el.style.height=h+'px';
      el.style.left='calc('+c.x+'% - '+Math.round(h*.35)+'px)';
      el.style.top='calc('+c.y+'% - '+Math.round(h*.5)+'px)';
      const img=document.createElement('img');
      img.src='assets/'+c.a;img.draggable=false;
      el.appendChild(img);sc.appendChild(el);
      setTimeout(()=>{el.classList.add('v');setTimeout(()=>el.classList.add('i-'+c.i),900)},80+i*200);
    });
    setTimeout(()=>fd.classList.remove('on'),80);
  },300);
}
</script>
</body>
</html>
